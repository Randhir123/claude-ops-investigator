[project]
name = "jvm-troubleshooter-mcp"
version = "0.1.0"
description = "A dedicated MCP server exposing OpenJ9/IBM Semeru JVM observability tools (heap, GC, memory pools, threads) backed by Prometheus, for use standalone or alongside an incident-investigation MCP server such as claude-ops-investigator."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  # Pinned below 2.0: mcp 2.x renamed FastMCP to MCPServer and changed its API.
  # claude-ops-investigator's own pyproject.toml pins "mcp>=1.0.0" with no
  # upper bound, which hits this same break on a fresh install -- worth
  # tightening there too, not just here.
  "mcp>=1.0.0,<2.0.0",
  # For the render_*_chart tools (chart_tools.py) -- rendered headlessly via the "Agg"
  # backend, no display server needed.
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
jvm-troubleshooter-mcp = "jvm_troubleshooter.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
